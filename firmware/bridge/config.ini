; reginsite serial->API bridge configuration
; Edit these to match your setup, then run:  python bridge.py

[bridge]
; Windows COM port the Arduino Mega shows up as (Device Manager > Ports).
; Common values: COM3, COM4. On Linux/Mac use e.g. /dev/ttyACM0.
serial_port = COM4
baud_rate   = 115200

; Where the Laravel app is reachable from the mini PC.
; If Laravel runs on THIS mini PC, leave as localhost:8000.
base_url = http://localhost:8000

; Must match DEVICE_API_KEY in laravel/.env
api_key  = regin-esp32-2026

; --- No-QR test settings -------------------------------------------------
; Until the QR student scan is added, every toggle is attributed to this
; student. QR-2026-0132 = Mark Santos (eligible to borrow).
test_student_qr = QR-2026-0132

; Which database tool_id sits in each physical locker (locker:tool_id).
; Physical Locker 1 holds tool 1, etc. Change if your cabinet differs.
locker_tool_map = 1:1, 2:2, 3:3, 4:4
