; reginsite serial->API bridge configuration
; Edit these to match your setup, then run:  python bridge.py

[bridge]
; Windows COM port the Arduino Mega shows up as (Device Manager > Ports).
; Common values: COM3, COM4. On Linux/Mac use e.g. /dev/ttyACM0.
; This is controller 1 (cabinets 1-5): the board with the RC522 and the buzzer.
; Windows renumbers COM ports when you use a different USB socket, so if the
; bridge reports the wrong cabinets, re-check here — the board also announces
; itself as "READY,<controller_id>" on connect.
serial_port = COM5
baud_rate   = 115200

; Where the Laravel app is reachable from the mini PC.
; If Laravel runs on THIS mini PC, leave as localhost:8000.
base_url = http://localhost:8000

; Must match DEVICE_API_KEY in laravel/.env
api_key  = regin-esp32-2026

; --- DEAD KEYS ------------------------------------------------------------
; Nothing in the repo reads either of these. They are kept only so nobody
; re-adds them expecting an effect. The cabinet a tool lives in comes from
; tools.locker_id in the database (see DatabaseSeeder.php), and the student
; comes from the QR scan on the terminal.
;   test_student_qr = QR-2026-0132
;   locker_tool_map = 1:1, 2:2, 3:3, 4:4
