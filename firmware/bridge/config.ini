; reginsite serial->API bridge configuration
; Edit these to match your setup, then run:  python bridge.py

[bridge]
; Windows COM ports the Arduino Megas show up as (Device Manager > Ports),
; comma-separated, one per controller. On Linux/Mac use e.g. /dev/ttyACM0.
; Order does NOT matter: each board announces "READY,<controller_id>" and its
; cabinet range on connect, and the bridge routes OPEN commands by that — so
; Windows renumbering COM ports when you use a different USB socket only means
; updating the list here, never a mis-routed door.
;   controller 1 = cabinets 1-5, the board with the RC522 and the buzzer
;   controller 2 = cabinets 6-10, no reader
; (the old single-board key `serial_port = COM5` is still accepted)
serial_ports = COM5, COM9
baud_rate    = 115200

; Where the Laravel app is reachable from the mini PC.
; If Laravel runs on THIS mini PC, leave as localhost:8000.
base_url = http://localhost:8000

; Must match DEVICE_API_KEY in laravel/.env
api_key  = regin-esp32-2026

; --- DEAD KEYS ------------------------------------------------------------
; Nothing in the repo reads either of these. They are kept only so nobody
; re-adds them expecting an effect. The cabinet a tool lives in comes from
; tools.locker_id in the database (see DatabaseSeeder.php), and the student
; comes from the QR scan on the terminal.
;   test_student_qr = QR-2026-0132
;   locker_tool_map = 1:1, 2:2, 3:3, 4:4
