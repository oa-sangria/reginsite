<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reginsite — Admin Login</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="login-brand">
        <svg class="icon brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
        </svg>
        <div>
          <div class="brand-name">Reginsite</div>
          <div class="brand-sub">Smart Tool Locker</div>
        </div>
      </div>

      <h2>Admin Sign In</h2>
      <p class="sub">Tool/Locker Borrowing Management System</p>

      <div class="login-err" id="loginErr">Invalid username or password.</div>

      <div class="field">
        <label for="user">Username</label>
        <input class="input" type="text" id="user" placeholder="admin" autocomplete="username" />
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input class="input" type="password" id="pass" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary" type="submit">Sign In</button>

      <div class="login-hint">
        Prototype demo — use <code>admin</code> / <code>admin</code>
      </div>
    </form>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // Already signed in? skip to dashboard.
    if (App.currentUser()) location.href = "dashboard.html";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.getElementById("user").value.trim();
      var p = document.getElementById("pass").value;
      var err = document.getElementById("loginErr");
      var btn = document.querySelector(".login-card .btn-primary");
      err.classList.remove("show");
      btn.disabled = true; btn.textContent = "Signing in…";
      App.login(u, p).then(function () {
        location.href = "dashboard.html";
      })["catch"](function (ex) {
        if (ex.code === "no_db") { location.href = "api/install.php"; return; }
        err.textContent = ex.message || "Invalid username or password.";
        err.classList.add("show");
        btn.disabled = false; btn.textContent = "Sign In";
      });
    });
  </script>
</body>
</html>
